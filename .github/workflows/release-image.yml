name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release (e.g. v2.4.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

      - name: Extract version from tag
        id: version
        env:
          # Through env, never inlined into the script: inputs.tag is free text.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A tag on the wrong commit fails here, in seconds, before any build.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION but the tag is $TAG"
            exit 1
          fi
          # Only the newest release moves :latest, so re-running an old tag can't roll it back.
          NEWEST="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)"
          {
            echo "tags<<EOF"
            echo "ghcr.io/rmdes/bsky.rss:$VERSION"
            if [ "$TAG" = "$NEWEST" ]; then echo "ghcr.io/rmdes/bsky.rss:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "newest tag is $NEWEST; tagging latest: $([ "$TAG" = "$NEWEST" ] && echo yes || echo no)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build each platform locally and start it before anything is pushed: a broken image
      # (e.g. node:26 dropping yarn) never gets a version tag. arm64 runs under QEMU. The
      # push step below reuses these layers from the builder's cache.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: bsky-rss:smoke-amd64
          cache-from: type=gha

      - name: Smoke-test amd64
        run: .github/scripts/smoke-image.sh bsky-rss:smoke-amd64 linux/amd64

      - name: Build arm64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: bsky-rss:smoke-arm64
          cache-from: type=gha

      - name: Smoke-test arm64
        run: .github/scripts/smoke-image.sh bsky-rss:smoke-arm64 linux/arm64

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
