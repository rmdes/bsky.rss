name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release (e.g. v2.4.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 locally and check it starts before anything is pushed: a broken
      # image (e.g. node:26 dropping yarn) or a tag on the wrong commit stops here.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: bsky-rss:smoke

      - name: Smoke-test image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -e EXPECTED_VERSION bsky-rss:smoke node --import tsx -e "
            await import('@atproto/api');
            await import('jimp');
            await import('open-graph-scraper');
            const {BotStore} = await import('./fleet/botStore.ts');
            new BotStore(':memory:');
            const pkg = await import('./package.json', {with: {type: 'json'}});
            if (pkg.default.version !== process.env.EXPECTED_VERSION) {
              throw new Error('package.json is ' + pkg.default.version + ', tag says ' + process.env.EXPECTED_VERSION);
            }
            console.log('image OK on', process.version, 'version', pkg.default.version);
          "

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rmdes/bsky.rss:${{ steps.version.outputs.version }}
            ghcr.io/rmdes/bsky.rss:latest
