name: Renovate Dry Run

# Manual, on-demand diagnostic: runs Renovate against this repo's own
# renovate.json and logs what it would do, without creating or updating
# anything. Lets us validate the config independent of the hosted GitHub
# App's own schedule/webhook delivery.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Self-hosted Renovate (dry run)
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: debug
