# app.yaml - DigitalOcean App Platform configuration for bsky.rss
# See https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: bsky-rss
region: nyc

services:
  - name: bsky-rss-worker
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      # repo: username/bsky.rss  # Uncomment and set your repo

    instance_count: 1
    instance_size_slug: basic-xxs

    # Environment variables
    envs:
      - key: INSTANCE_URL
        value: "https://bsky.social"
      - key: HEALTH_CHECK_PORT
        value: "8080"
      - key: IDENTIFIER
        scope: RUN_TIME
        type: SECRET  # Set this in DigitalOcean dashboard
      - key: APP_PASSWORD
        scope: RUN_TIME
        type: SECRET  # Set this in DigitalOcean dashboard
      - key: FETCH_URL
        scope: RUN_TIME
        type: SECRET  # Set this in DigitalOcean dashboard
      - key: FETCH_INTERVAL
        value: "5"

    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # HTTP port configuration
    http_port: 8080
